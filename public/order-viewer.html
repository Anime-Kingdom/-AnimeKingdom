<style>
*{box-sizing:border-box}body{margin:0;background:#100b18;color:#eee7f7;font:16px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:36px 20px}h1{font-size:36px;margin:0}h2{font-size:22px}h3{margin:0}p{color:#cbbdd9}label,button{font:inherit}input,button{padding:12px;border:1px solid #75508f;border-radius:8px;background:#251632;color:inherit}input[type=search]{width:100%;margin:20px 0}button{cursor:pointer}article{border:1px solid #624577;border-radius:16px;padding:24px;margin:24px 0;background:#1b1225}.columns{display:grid;grid-template-columns:1fr 1fr;gap:24px}.item{display:flex;gap:18px;border-top:1px solid #463052;padding:18px 0}.item img{width:110px;height:130px;object-fit:contain;background:#100b18;border-radius:10px}.item p{margin:4px 0}.total{font-size:24px;font-weight:700;color:#b9f5c7}small{overflow-wrap:anywhere;color:#cbbdd9}address{font-style:normal;white-space:pre-line}.toolbar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:24px}a{color:#d4a4ff}.error{color:#ffa6ab}@media(max-width:600px){.columns{grid-template-columns:1fr}article{padding:16px}.item img{width:80px;height:100px}h1{font-size:28px}}@media print{.toolbar,#search,.intro{display:none}body,article{background:white;color:black}p,small,a,.total{color:black}article{break-inside:avoid}}
</style></head><body><main><h1>Anime Kingdom orders</h1><p class="intro">Export your AK orders table from Supabase as CSV or JSON, then open the file here. See products, prices, delivery details and payment information together. Files are read on this device and are not uploaded or saved by this viewer.</p><div class="toolbar"><label>Open order export <input id="file" type="file" accept=".csv,.json"></label><button id="clear">Clear orders</button><button id="print">Print</button></div><input id="search" type="search" aria-label="Search orders" placeholder="Search customer, order number, product or city"><p id="status" role="status">No order file opened.</p><section id="orders"></section></main><script src="./storefront/order-viewer.js" defer></script></body></html>
